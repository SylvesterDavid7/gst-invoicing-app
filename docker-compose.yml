services:
  redis:
    image: redis:7-alpine
    container_name: gst_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-strongredispass123}"]
    volumes:
      - redis_data:/data
    networks:
      - gst_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-strongredispass123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gst_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-strongredispass123}@redis:6379
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-LOCAL}
      - HOST=${HOST}
      - APP_URL=${HOST}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin@gst2026}
      - ADMIN_SECRET=${ADMIN_SECRET:-gst-admin-supersecret-2026}
      - SHOPIFY_API_KEY=${SHOPIFY_API_KEY}
      - SHOPIFY_API_SECRET=${SHOPIFY_API_SECRET}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - SKIP_HMAC_VERIFICATION=${SKIP_HMAC_VERIFICATION:-false}
      - SCOPES=${SCOPES:-read_orders,write_orders,read_products,read_customers}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_PUBLIC_DOMAIN=${S3_PUBLIC_DOMAIN:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    volumes:
      - invoices_data:/app/public/invoices
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - gst_network

volumes:
  redis_data:
  invoices_data:

networks:
  gst_network:
    driver: bridge
