# Shopify App Configuration for Indian GST Invoicing App
client_id = "your_shopify_api_key"
name = "GST Invoicing & B2B Tax Pro"
handle = "gst-invoicing-pro"
application_url = "https://your-app-domain.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = ""

[access_scopes]
scopes = "read_orders,write_orders,read_products,read_customer_events,read_metaobjects"

[webhooks]
api_version = "2024-10"

  [[webhooks.subscriptions]]
  topics = [ "orders/paid" ]
  uri = "/webhooks/orders-paid"

  [[webhooks.subscriptions]]
  topics = [ "refunds/create" ]
  uri = "/webhooks/refunds-create"

[auth]
redirect_urls = [
  "https://your-app-domain.com/auth/callback",
  "https://your-app-domain.com/auth/shopify/callback"
]

[pos]
embedded = false
